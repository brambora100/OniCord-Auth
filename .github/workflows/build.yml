name: Build and Release OniCord Auth

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract and build
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'OniCord-Auth*.zip' -print -quit)
          test -n "$ZIP"
          unzip -o "$ZIP" -d project
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Prepare JAR
        run: |
          JAR=$(find project -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-javadoc.jar' -print -quit)
          test -n "$JAR"
          cp "$JAR" onicordauth.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create build-${{ github.run_number }} \
            onicordauth.jar \
            --title "OniCord Auth Build ${{ github.run_number }}" \
            --notes "Automatic OniCord Auth build" \
            --latest
