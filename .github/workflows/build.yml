name: Build OniCord Auth

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract and build
        run: |
          unzip -o OniCord-Auth-Forge-1.20.1.zip -d project
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OniCord-Auth-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
